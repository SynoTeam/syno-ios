name: BugFix Issue
description: 버그 수정용 이슈 템플릿입니다.
title: "BugFix: "
labels: ["🐞 BugFix"]
body:
  - type: input
    id: description
    attributes:
      label: "🐞 버그 설명"
      description: "어떤 버그인지 명확히 작성해주세요"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "🔧 수정할 작업 목록"
      description: "수정해야 할 항목들을 체크리스트로 작성해주세요"
      value: |
        - [ ] 버그 재현
        - [ ] 원인 분석
        - [ ] 수정 및 테스트
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🎯 재현 조건과 수용 기준"
      description: "재현 조건, 기대 동작, 실제 동작을 적고, 수정 후 판정할 기준을 \"~하면, 시스템은 ~한다\" 문장으로 작성해주세요. (선택)"
      placeholder: |
        - 재현 조건: 연락처 편집에서 그룹을 바꾼 뒤 목록으로 돌아간다
        - 기대 동작: 연락처 행에 바뀐 그룹명이 보인다
        - 실제 동작: 이전 그룹명이 보인다
        - 수용 기준: 연락처의 그룹을 바꾸면, 시스템은 목록 행의 그룹명을 즉시 갱신한다
    validations:
      required: false

  - type: input
    id: links
    attributes:
      label: "🔗 참고 링크"
      description: "관련 문서, 스크린샷, 로그 등이 있다면 첨부해주세요 (선택)"
      placeholder: "https://..."
    validations:
      required: false
