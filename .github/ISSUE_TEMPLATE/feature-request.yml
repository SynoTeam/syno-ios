name: Feature Issue
description: 새로운 기능을 개발할 때 사용하는 템플릿입니다.
title: "Feature: "
labels: ["✨ Feature"]
body:
  - type: input
    id: description
    attributes:
      label: "📝 기능 설명"
      description: "개발할 기능에 대해 간단히 설명해주세요"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 목록"
      description: "수행할 작업을 체크리스트 형식으로 작성해주세요"
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🎯 수용 기준"
      description: "완료를 판정할 기준을 \"~하면, 시스템은 ~한다\" 문장으로 작성해주세요. 경계값을 포함하면 좋습니다. 큰 기능은 Docs/specs/_TEMPLATE.md로 명세를 작성합니다. (선택)"
      placeholder: |
        - 새 그룹 입력 중 기존 그룹을 선택하면, 시스템은 입력을 닫고 마지막 선택을 적용한다
        - 그룹 이름이 비어 있으면, 시스템은 저장 버튼을 비활성화한다
    validations:
      required: false

  - type: input
    id: links
    attributes:
      label: "🔗 참고 링크"
      description: "관련 문서, 디자인 링크 등이 있다면 첨부해주세요 (선택)"
      placeholder: "https://..."
    validations:
      required: false
