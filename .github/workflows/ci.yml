name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

# 같은 브랜치에 새로 push하면 이전 실행을 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 선택
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: SPM 패키지 캐시
        uses: actions/cache@v6
        with:
          path: SourcePackages
          key: spm-${{ hashFiles('Syno/Syno.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # 테스트 호스트 앱이 App Group entitlement를 써야 해서 서명을 끄지 않고 ad-hoc 서명을 씁니다.
      - name: 단위 테스트 (Unit 플랜)
        run: |
          xcodebuild test \
            -project Syno/Syno.xcodeproj \
            -scheme Syno \
            -testPlan Unit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults-Unit.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=

      # 위 단계의 빌드 결과(DerivedData)를 그대로 써서 UI 테스트 타깃만 추가로 빌드합니다.
      - name: UI 테스트 (UI 플랜)
        run: |
          xcodebuild test \
            -project Syno/Syno.xcodeproj \
            -scheme Syno \
            -testPlan UI \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
            -clonedSourcePackagesDirPath SourcePackages \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults-UI.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=

      - name: 실패 시 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults-*.xcresult
          retention-days: 7
